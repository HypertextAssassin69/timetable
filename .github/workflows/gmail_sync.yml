name: Gmail Timetable Sync

on:
  push:
    branches:
      - main
  schedule:
    # Run every 3 hours daily
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to ensure merge rebase works correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-level: '3.10'
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Git Pull Rebase (Prevent Conflicts)
        run: |
          git config --global user.name "GitHub Action Sync"
          git config --global user.email "action@github.com"
          # Fetch and rebase to merge any concurrent manual commits from the web frontend
          git pull --rebase origin main

      - name: Run Gmail Sync Script
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python sync_gmail.py
          python print_emails.py
          python test_gemini.py

      - name: Commit and Push Changes
        run: |
          git add -f timetable.json email_log.txt gemini_status.txt 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "auto_sync: sync timetable, email_log and gemini_status [skip ci]"
            git push origin main
          else
            echo "No changes to push."
          fi
